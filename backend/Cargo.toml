[package]
name = "pymza_backend"
version = "0.1.0"
edition = "2018"

[dependencies]
mongodb = { version = "2.8.2", default-features = false, features = ["tokio-runtime", "openssl-tls"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
axum = "0.6"
tower-http = { version = "0.4", features = ["cors"] }
dotenvy = "0.15"
futures = "0.3"
chrono = "0.4"

argon2 = "0.5"
jsonwebtoken = "9"
