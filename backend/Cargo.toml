[package]
name = "pymza_backend"
version = "0.1.0"
edition = "2018"

[dependencies]
mongodb = "2.4.0"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
axum = "0.6"
tower-http = { version = "0.4", features = ["cors"] }
dotenvy = "0.15"
