[package]
name = "pymza_backend"
version = "0.1.0"
edition = "2018"

[dependencies]
mongodb = { version = "2.8.2", default-features = false, features = ["tokio-runtime", "openssl-tls"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
axum = "0.6"
tower-http = { version = "0.4", features = ["cors"] }
dotenvy = "0.15"
futures = "0.3"
chrono = "0.4"

argon2 = "0.5"
jsonwebtoken = "9"

# Ola 5 (KYC/recibos): decodificar el archivo subido en base64 (JSON).
# El motor OCR es el binario tesseract — CERO crates de OCR.
base64 = "0.22"

# Ola 3 (OTP por teléfono): HTTP a la WhatsApp Cloud API, código aleatorio y hash.
reqwest = { version = "0.11", features = ["json"] } # default-tls (OpenSSL), coherente con mongodb openssl-tls
rand = "0.8"
sha2 = "0.10"
